backend:
    name: git-gateway
    branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
    - name: "projects"
      label: "Projects"
      folder: "src/content/projects"
      create: true
      slug: "{{slug}}"
      fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Titre anglais (optionnel)", name: "titleEn", widget: "string", required: false }
          - { label: "Publish Date", name: "publishDate", widget: "datetime" }
          - { label: "Description courte", name: "description", widget: "text", required: false }
          - { label: "Short description in English", name: "descriptionEn", widget: "text", required: false }
          - { label: "Main Image", name: "mainImage", widget: "image" }
          - label: "Contexte de création"
            name: "origin"
            widget: "select"
            required: false
            options:
              - { label: "Formation - Campus 120", value: "campus120" }
              - { label: "Expérience - Cheval Blanc", value: "cheval-blanc" }
              - { label: "Création personnelle", value: "personal" }
              - { label: "Autre", value: "other" }
          - label: "Gallery (Optional)"
            name: "gallery"
            widget: "list"
            required: false
            summary: "{{fields.image}}"
            field: { label: "Image", name: "image", widget: "image" }
          - {
                label: "Tags",
                name: "tags",
                widget: "list",
                default: ["Patisserie"],
            }
          - { label: "Body", name: "body", widget: "markdown" }

    - name: "settings"
      label: "⚙️ Paramètres"
      files:
          - name: "homepage"
            label: "Page d'accueil"
            file: "src/content/settings/homepage.json"
            fields:
                - label: "Projets mis en avant"
                  name: "featuredProjects"
                  widget: "list"
                  max: 3
                  min: 0
                  summary: "{{fields.project}}"
                  field:
                      label: "Projet"
                      name: "project"
                      widget: "relation"
                      collection: "projects"
                      search_fields: ["title"]
                      value_field: "{{slug}}"
                      display_fields: ["title"]
